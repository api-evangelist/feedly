    file: feedly-api-catalog.json
    note: >-
      Real linkset. 21 service-desc entries of type application/vnd.oai.openapi+json pointing at
      https://developers.feedly.com/openapi/<id>. 17 resolve 200 as OpenAPI 3.0/3.1; 3 return 404
      (stale catalog entries, ids 69c15101706bb016d588b265, 69c16e9c94c0a2b0ac67267e,
      655b81ac5ed961054e8f54b6); 1 is a duplicate href. Harvested into openapi/.
