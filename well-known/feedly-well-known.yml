description: >-
  Feedly serves two real /.well-known/ documents, and they are the reason this profile has a machine-
  readable contract at all. developers.feedly.com publishes an RFC 9727 API Catalog (linkset) naming
  21 OpenAPI service-desc URLs — 17 of which resolve to live, first-party OpenAPI 3.x documents. The
  Threat Graph MCP host publishes RFC 8414 OAuth 2.0 Authorization Server Metadata with dynamic client
  registration. Neither is linked from the human documentation; both were found only by probing.

