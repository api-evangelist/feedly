crosswalk:
- tool: search_entities
  category: entity resolution
  rest: [autocomplete-entities]
  binding: rest
  confidence: high
  note: >-
    GET /v3/search/entities. Feedly's own IoC Lookup changelog describes this exact endpoint as the
    "resolve" step that converts a raw IoC (domain, IP, URL, hash) into a Feedly entity ID, which is
    what the skill instructs the tool to do. Direct match.
- tool: get_threat_actor_relationships
  category: threat actors
  rest: [get-threat-actor-relationships]
  binding: rest
  confidence: high
  note: >-
    GET /v3/ml/relationships/actor/{threatActorId}. Name, path and documented purpose (associated
    malware, targeted orgs/sectors, TTPs, period-matched) all align.
- tool: get_malware_relationships
  category: malware
  rest: [get-malware-relationships]
  binding: rest
  confidence: high
  note: GET /v3/ml/relationships/malware/{malwareId}. Direct name and semantic match.
- tool: get_vulnerability_info
  category: vulnerabilities
  rest: [cve-insights-card]
  binding: rest
  confidence: high
  note: >-
    GET /v3/entities/{CVEID} — the CVE Insights Card, the single-CVE metadata operation the skill
    routes to for "a specific vulnerability or CVE".
- tool: search_vulnerabilities
  category: vulnerabilities
  rest: [getVulnerabilityAgent, get-multiple-cves]
  binding: rest
  confidence: medium
  note: >-
    The skill uses this "for a set" of vulnerabilities. Two operations can serve that: POST
    /v3/trends/vulnerability-dashboard (the Vulnerability Agent query, with layered filters on
    cvssScore/exploited/inCisaKev/period) and POST /v3/entities/.mget (bulk CVE metadata). The
    filtered-query semantics point at the Vulnerability Agent; recorded as a fan-out rather than
    guessing one.
- tool: get_trending_vulnerabilities
  category: trending
  rest: [trending-cves]
  binding: rest
  confidence: high
  note: GET /v3/memes/vulnerabilities/en — "Trending Vulnerabilities" from the Threat Landscape dashboard.
- tool: get_trending_threat_actors
  category: trending
  rest: [trending-attackers]
  binding: rest
  confidence: high
  note: GET /v3/trends/threat-actors — "Trending Attackers".
- tool: get_trending_articles
  category: trending
  rest: [trending-articles]
  binding: rest
  confidence: high
