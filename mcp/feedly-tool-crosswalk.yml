mcp_only:
- tool: search_cpe
  reason: >-
    Affected-product (CPE) search is offered to agents but has no counterpart anywhere in the 49
    published REST operations. A REST consumer cannot pivot from a CVE to affected products the way
    an MCP client can — this is a genuine surface divergence, not a documentation gap.

unnamed_tools:
  count: 3
  reason: >-
    Feedly documents 16 tools; 13 are named in its published skill. The remaining 3 are not named in
    any public first-party source and tools/list is gated, so they are recorded as unknown. No names
    are invented for them.

rest_only:
  note: >-
    Operations with no counterpart in any named MCP tool. The MCP server is a read-only research
    surface over the Threat Graph, so the entire write, administration and team-collaboration surface
    is REST-only — an agent connected over MCP can research but cannot curate, annotate, or automate.
  groups:
  - capability: team boards and article curation (writes)
    operations: [add-articles-to-board, delete-article-from-board, annotate-articles, get-list-of-team-boards]
  - capability: webhook / trigger management (writes)
    operations: [get-the-list-of-webhooks, create-or-update-a-webhook, delete-a-webhook]
  - capability: enterprise administration
    operations: [listEnterpriseUsers, getTeamFolders, getEntityLists, get-list-of-ai-feeds]
  - capability: custom and built-in agents
    operations: [get-agents, get-custom-agent]
  - capability: article retrieval and AI actions
    operations: [collect-articles, get-article-metadata, get-multiple-article-metadata, ai-actions-experimental]
  - capability: entity and IoC detail
    operations: [entity-lookup, getEntityDetails, collect-iocs, getCveTimeline, get-threat-actor-metadata, get-malware-metadata]
  - capability: malware enrichment
    operations: [get-malware-article-graph, get-malware-detection-rules, trending-new-malware]
  - capability: cyberattack detail
    operations: [get-cyber-attacks-statistics, get-individual-cyber-attack-details]
  - capability: TTP procedures
    operations: [collect-procedures]
  - capability: company / market intelligence
    operations: [company-metadata, key-metrics, article-counts, resource-counts, top-stories, emerging-trends, trend-analysis-card]

