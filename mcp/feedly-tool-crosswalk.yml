description: >-
  Binds Feedly's Threat Graph MCP tools to the REST operations that back them. The live tools/list is
  OAuth-gated, so the tool names here were NOT read from the server — they were read from Feedly's own
  published Claude skill, which routes requirements to named tools in a tool-routing table. That makes
  the names first-party and citable, but it does NOT give inputSchemas: those still require
  authenticated introspection. Confidence on every row reflects that gap honestly.

