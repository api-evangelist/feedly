openapi: 3.2.0
info:
  title: Memes Vulnerabilities API
  version: '1.0'
servers:
- url: https://api.feedly.com/v3/memes
security:
- sec0: []
tags:
- name: Vulnerabilities
paths:
  /vulnerabilities/en?:
    get:
      summary: Trending Vulnerabilities
      description: A guide to extract trending vulnerabilities from the Threat Landscape Dashboard.
      operationId: trending-cves
      parameters:
      - name: count
        in: query
        description: The number of articles/entries to return. Maximum is 25.
        schema:
          type: integer
          format: int32
          default: 25
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Vulnerabilities
components:
  securitySchemes:
    sec0:
      type: apiKey
      in: header
      name: Authorization
      x-bearer-format: bearer
x-readme:
  headers: []
  explorer-enabled: true
  proxy-enabled: true
x-readme-fauxas: true
