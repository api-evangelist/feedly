apis:
- name: Feedly API
  description: REST API over api.feedly.com/v3 for the Feedly Threat Intelligence platform. Collect articles
    from AI Feeds, Folders and Boards by streamId; search and query the corpus with the Ask AI (RAG) endpoints;
    retrieve CVE, malware, threat-actor and company insight cards plus their relationship graphs; pull
    trending vulnerabilities, malware and attackers; export IoCs with context; manage team boards, annotations,
    enterprise users, collections and intel profiles; and register webhooks. Bearer-token authenticated,
    JSON over HTTPS, cursor pagination via continuation tokens.
  humanURL: https://developers.feedly.com/reference/introduction
  baseURL: https://api.feedly.com/v3
