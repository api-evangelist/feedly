apis:
- name: Feedly Threat Graph MCP Server
  description: >-
    Hosted, remote Model Context Protocol server exposing the Feedly Real-Time Threat Graph to AI agents.
    Feedly documents 16 tools covering threat actors, malware, vulnerabilities, TTPs, IoCs and cyberattacks.
    Protected by OAuth 2.1 with dynamic client registration (RFC 7591) and PKCE; anonymous tools/list
    returns 401 invalid_token. Bundled with the Advanced plan.
  humanURL: https://docs.feedly.com/article/820-what-is-mcp-feedly
  baseURL: https://mcp.feedly.com/mcp
  tags:
  - MCP
  - agent-native
  - Threat Intelligence
  - Cybersecurity
  tags_raw:
