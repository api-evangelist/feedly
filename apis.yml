aid: feedly
name: Feedly
description: Feedly is a content aggregation and threat intelligence platform that reads millions of open
  sources and turns them into structured, machine-readable intelligence. Its consumer product is a feed
  reader built on RSS/Atom; its commercial product, Feedly Threat Intelligence, applies a family of AI
  models ("Leo") to build a Real-Time Threat Graph covering threat actors, malware families, CVEs, indicators
  of compromise, MITRE ATT&CK techniques, and cyberattacks. The Feedly API is a REST API over api.feedly.com/v3
  that exposes those objects to security teams for SOAR/SIEM automation — collecting articles from AI
  Feeds, Folders and Boards, searching and asking questions of the corpus with LLMs, pulling CVE/malware/threat-actor
  insight cards and their relationships, exporting IoCs with context, and registering webhooks for saved-article
  and annotation events. Feedly also operates a hosted, OAuth-protected Model Context Protocol server
  over its Threat Graph, and publishes an open-source library of CTI Agent Skills and prompts for Claude.
