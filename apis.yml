- aid: feedly:feedly-custom-agents-api
  name: Feedly Custom Agents API
  description: >-
    > 🚧 Alpha: Custom Agents is a new capability and still under active development. Endpoints, fields,
    and behavior may change without notice.


    Custom Agents let enterprise teams stand up their own tables of AI-tracked entities (malware families,
    threat actors, vendors, etc.) driven by a natural-language Priority Intelligence Requirement (PIR).
    Custom Agents are one `type` of dashboard returned by `GET /dashboards`.
