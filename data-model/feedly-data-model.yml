- {from: ThreatActor, to: TTP, kind: has_many, via: relationships, operation: get-threat-actor-relationships}
- {from: ThreatActor, to: IoC, kind: has_many, via: relationships, operation: get-threat-actor-relationships}
- {from: Malware, to: ThreatActor, kind: has_many, via: relationships, operation: get-malware-relationships}
- {from: Malware, to: TTP, kind: has_many, via: relationships, operation: get-malware-relationships}
- {from: Malware, to: Entry, kind: has_many, via: article-count-graphs, operation: get-malware-article-graph}
- {from: Malware, to: DetectionRule, kind: has_many, via: detection-rules, operation: get-malware-detection-rules}
- {from: Vulnerability, to: TimelineEvent, kind: has_many, via: timeline, operation: getCveTimeline}
- {from: Vulnerability, to: ThreatActor, kind: has_many, via: relationships}
- {from: Vulnerability, to: Malware, kind: has_many, via: relationships}
- {from: IoC, to: Entry, kind: has_many, via: article context, operation: collect-iocs}
- {from: CyberAttack, to: Entry, kind: has_many, via: source articles}
- {from: CyberAttack, to: ThreatActor, kind: has_many, via: related entities}
- {from: TTP, to: Entry, kind: has_many, via: procedures, operation: collect-procedures}
- {from: IntelProfile, to: Entity, kind: has_many, via: members, note: "members may be unresolved text with no id"}
- {from: Agent, to: AgentRow, kind: has_many, via: rows, operation: get-custom-agent}
- {from: Trigger, to: Board, kind: belongs_to, via: resourceId, note: "NewEntrySaved fires on a board"}
- {from: EnterpriseUser, to: Entry, kind: has_many, via: savedBy}

polymorphism_note: >-
  Five operations in the Entities API — cve-insights-card, get-malware-metadata, entity-lookup,
  get-threat-actor-metadata and company-metadata — are the SAME path GET /v3/entities/{id} declared
  five times with five different path-parameter names ({CVEID}, {malwareId}, {entityId},
  {threatActorId}, {resourceId}). They are one polymorphic endpoint documented as five operations. A
  code generator will emit five near-identical methods; a consumer should treat them as one.

schema_gap:
  severity: high
  finding: >-
    The published OpenAPI documents carry essentially no response schemas. Across 49 operations, the
    dominant 200 declaration is `{"type": "object", "properties": {}}` with an example value of
    `"{}"`. components.schemas is absent or near-empty in every document.
  consequence: >-
    No usable client model can be generated from Feedly's OpenAPI. The real object shapes exist only
    as human-readable tables on seven "JSON structure" reference pages. This is the single largest
    contract-quality defect in the profile and the reason this data model had to be derived from prose
    as well as from the spec.
  affected_references:
  - https://developers.feedly.com/reference/articlejson
  - https://developers.feedly.com/reference/cve-json
  - https://developers.feedly.com/reference/threat-actor-insight-card-json
  - https://developers.feedly.com/reference/malware-insight-card-json
  - https://developers.feedly.com/reference/vulnerability-agent-json-structure
  - https://developers.feedly.com/reference/ttp-agent-json-structure
  - https://developers.feedly.com/reference/cyber-attacks-agent-json-structure
