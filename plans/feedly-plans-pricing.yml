api_gating:
  summary: >-
    API and MCP access sit behind the top paid tier AND a sales conversation. There is no free tier,
    no developer sandbox, and no self-serve signup path to a token — an admin on an Enterprise account
    must generate it at https://feedly.com/i/team/api.
  consequence: >-
    A developer cannot evaluate the Feedly API before purchase. This is a commercial choice, not a
    documentation gap: the OpenAPI, the reference and the llms.txt are all fully public and readable
    anonymously; only execution is gated.

consumer_product:
  note: >-
    Feedly also sells consumer/Pro feed-reader plans on a separate page (feedly.com/i/pricing, which
    the edge rate-limiter returned 429 for on probe). Those tiers are not part of the Threat
    Intelligence API surface and are not modelled here.

