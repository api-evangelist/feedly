dates_note: >-
  DATES NOT CAPTURED — recorded honestly rather than guessed. The changelog HTML carries per-entry
  dates, but developers.feedly.com returns HTTP 429 (a Cloudflare "Hello there, human!" challenge) to
  non-browser clients for every HTML path. The .md twins that ReadMe serves — which DO return 200 —
  omit the date line entirely, and llms.txt lists titles without dates. So the machine-readable
  surface of this changelog has no timestamps on it. Ordering below is the provider's own
  newest-first ordering from llms.txt and is reliable; the absolute dates are not available to a
  machine and are therefore null rather than invented.

