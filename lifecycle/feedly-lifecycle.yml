description: >-
  Feedly's versioning, deprecation and operational-transparency posture. It runs a public status page
  and a dated changelog, but publishes no deprecation policy, no sunset guarantees and no SLA — and it
  has shipped at least two field/response-shape removals in place on v3.

versioning:
  scheme: uri-path
  current: v3
  docs: https://developers.feedly.com/reference/introduction
  header_versioning: false
  date_versioning: false
  note: >-
    /v3 is the only version segment in every published OpenAPI servers[] block. There is no version
    header, no date-pinned version, and no published statement about how a future major version would
    be introduced or how long v3 would remain supported.

deprecation:
  policy_url: null
  policy_published: false
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  note: >-
    NO deprecation policy exists. Feedly publishes no notice period, no support window, and does not
    emit RFC 8594 Sunset or Deprecation headers. Changes are announced in the changelog only, with no
    dated removal schedule. A consumer's only warning mechanism is reading the changelog.
  deprecated_operations_in_spec: []
  spec_note: >-
    Zero of the 49 published operations carry `deprecated: true`. Every spec that sets the flag sets
    it to false. The specs therefore give no machine-readable deprecation signal at all.
  observed_breaking_changes:
  - change: >-
      `attackVector` field REMOVED from POST /v3/trends/vulnerability-dashboard and replaced with
      `cvssVector` (standard CVSS notation).
    operation: getVulnerabilityAgent
    kind: field removal
    announced: https://developers.feedly.com/changelog/vulnerability-dashboard-api-attackvector-field-deprecated
    notice_period: none published
    note: >-
      The changelog title says "Deprecated" but the body says "Removed" — the field was taken out, not
      deprecated. Old values were NETWORK, LOCAL, ADJACENT_NETWORK, PHYSICAL.
  - change: >-
      `relationships` field REMOVED from the GET /v3/entities/{threatActorId} response; relationship
      data moved to GET /v3/ml/relationships/actor/{threatActorId}.
    operation: get-threat-actor-metadata
    kind: response-shape removal
    announced: https://developers.feedly.com/changelog/threat-actor-relationships-endpoint-updates
    notice_period: none published
    note: >-
      The original endpoint is "still supported" but silently returns less. A client reading
      `relationships` now gets nothing rather than an error — a silent failure mode.

