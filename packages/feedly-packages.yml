method: searched
source: >-
  registry.npmjs.org search + pypi.org/pypi/<pkg>/json + api.github.com/orgs/feedly/repos, probed
  2026-08-12. Registry metadata read unauthenticated from the JSON endpoints.
description: >-
  Feedly ships exactly one first-party client library: a lightweight Python client for the Threat
  Intelligence API. There is no official JavaScript/TypeScript, Go, Java, Ruby, PHP or .NET SDK — the
  npm packages carrying "feedly" in the name are all third-party and most are long abandoned.

packages:
- language: python
  registry: pypi
  name: feedly-client
  url: https://pypi.org/project/feedly-client/
  repository: https://github.com/feedly/python-api-client
  install: pip install feedly-client
  official: true
  version: '0.27'
  published: '2025-10-10'
  license: MIT
  description: A lightweight client for the feedly api (https://developers.feedly.com).
  maintainer_email: ml@feedly.com
  note: >-
    First-party — authored by Feedly, published from the feedly GitHub org, and named in the setup.py
    AUTHOR field. Currency check: last release 2025-10-10, and the source repo's last push
    (2025-10-10) matches, so the package is not stale relative to its own repo. It IS stale relative
    to the API it wraps: Feedly shipped the Cyberattacks Dashboard API, the Custom Agents endpoints,
    the CVE timeline endpoint and the IoC details endpoint to the REST surface after that date, and
    none are covered by this client.

third_party_packages_note: >-
  Recorded so a consumer can tell them apart from the official client — none of these is published by
  Feedly, and every one predates the current Threat Intelligence API.

