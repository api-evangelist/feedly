generated: '2026-08-12'
method: searched
source: https://github.com/feedly/skills
description: >-
  Feedly is one of the few providers in the catalog that PUBLISHES its own Agent Skills. The
  feedly/skills repository is a Claude Code plugin marketplace (`feedly-cti-skills`, MIT licensed)
  distributing packaged CTI skills, plus a 44-prompt CTI prompt library. The provider-authored skill
  is captured here verbatim; the remaining entries are API Evangelist skills generated from Feedly's
  own OpenAPI, with every step grounded in a real operationId.

provider_published:
  repository: https://github.com/feedly/skills
  marketplace: feedly-skills
  plugin: feedly-cti-skills
  license: MIT
  owner: Feedly, Inc.
  last_push: '2026-07-31'
  install:
    claude_code: |
      /plugin marketplace add feedly/skills
      /plugin install feedly-cti-skills@feedly-skills
    claude_ai: Customize -> Plugins -> Add marketplace -> https://github.com/feedly/skills
    bundles: https://github.com/feedly/skills/releases (standalone .skill files)
  prompt_library:
    path: prompts/feedly-complete-cti-prompt-library/
    count: 44
    note: >-
      Plain prompts mirrored verbatim from four Feedly "TI Essentials" posts. Not packaged as skills.
      Indexed at skills/_provider/cti-prompt-library-README.md; not copied in full.

